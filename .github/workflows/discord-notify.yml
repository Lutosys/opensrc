name: Discord Notify
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Send to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Strip any hidden whitespace/newlines from the secret
          CLEAN_URL=$(echo "$WEBHOOK_URL" | tr -d '[:space:]')

          echo "URL length: ${#CLEAN_URL}"
          echo "URL starts with: ${CLEAN_URL:0:30}..."

          FILES=$(git diff --name-status HEAD~1 HEAD)
          ADDED=$(echo "$FILES" | grep '^A' | cut -f2)
          MODIFIED=$(echo "$FILES" | grep '^M' | cut -f2)
          REMOVED=$(echo "$FILES" | grep '^D' | cut -f2)

          MSG="${{ github.event.head_commit.message }}"

          # Build the loadstring code block for added/modified files
          CODEBLOCK=""
          DOWNLOAD_BUTTONS=""
          
          # Process added files
          if [ -n "$ADDED" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                FILENAME=$(basename "$file")
                CODEBLOCK="${CODEBLOCK}loadstring(game:HttpGet(\"https://raw.githubusercontent.com/Lutosys/opensrc/refs/heads/main/${FILENAME}\"))()\n"
                DOWNLOAD_BUTTONS="${DOWNLOAD_BUTTONS}[ Download ${FILENAME}](https://raw.githubusercontent.com/Lutosys/opensrc/refs/heads/main/${FILENAME}?download=1)\n"
              fi
            done <<< "$ADDED"
          fi
          
          # Process modified files
          if [ -n "$MODIFIED" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                FILENAME=$(basename "$file")
                CODEBLOCK="${CODEBLOCK}loadstring(game:HttpGet(\"https://raw.githubusercontent.com/Lutosys/opensrc/refs/heads/main/${FILENAME}\"))()\n"
                DOWNLOAD_BUTTONS="${DOWNLOAD_BUTTONS}[ Download ${FILENAME}](https://raw.githubusercontent.com/Lutosys/opensrc/refs/heads/main/${FILENAME}?download=1)\n"
              fi
            done <<< "$MODIFIED"
          fi

          # Remove trailing newlines
          if [ -n "$CODEBLOCK" ]; then
            CODEBLOCK=$(echo -e "$CODEBLOCK" | sed '/^$/d')
          fi
          if [ -n "$DOWNLOAD_BUTTONS" ]; then
            DOWNLOAD_BUTTONS=$(echo -e "$DOWNLOAD_BUTTONS" | sed '/^$/d')
          fi

          PAYLOAD=$(jq -n \
            --arg msg "$MSG" \
            --arg added "$ADDED" \
            --arg modified "$MODIFIED" \
            --arg removed "$REMOVED" \
            --arg codeblock "$CODEBLOCK" \
            --arg downloads "$DOWNLOAD_BUTTONS" \
            '{
              embeds: [{
                title: "Commit Pushed",
                color: 2829617,
                fields: [
                  {name: "Commit Message", value: $msg},
                  {name: "Added", value: ($added | if . == "" then "None" else . end)},
                  {name: "Modified", value: ($modified | if . == "" then "None" else . end)},
                  {name: "Removed", value: ($removed | if . == "" then "None" else . end)},
                  {name: "Download", value: (if $downloads != "" then $downloads else "No files to download" end), inline: false},
                  {name: "Loadstring", value: ("```lua\n" + $codeblock + "\n```"), inline: false}
                ]
              }]
            }')

          # Only send if there's code to show
          if [ -n "$CODEBLOCK" ]; then
            curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$CLEAN_URL"
          else
            echo "No files added or modified, skipping webhook"
          fi
