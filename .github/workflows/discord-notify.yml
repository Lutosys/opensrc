name: Discord Notify
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Send to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Strip any hidden whitespace/newlines from the secret
          CLEAN_URL=$(echo "$WEBHOOK_URL" | tr -d '[:space:]')

          echo "URL length: ${#CLEAN_URL}"
          echo "URL starts with: ${CLEAN_URL:0:30}..."

          FILES=$(git diff --name-status HEAD~1 HEAD)
          ADDED=$(echo "$FILES" | grep '^A' | cut -f2)
          MODIFIED=$(echo "$FILES" | grep '^M' | cut -f2)
          REMOVED=$(echo "$FILES" | grep '^D' | cut -f2)

          MSG="${{ github.event.head_commit.message }}"

          PAYLOAD=$(jq -n \
            --arg msg "$MSG" \
            --arg added "$ADDED" \
            --arg modified "$MODIFIED" \
            --arg removed "$REMOVED" \
            '{
              embeds: [{
                title: "Commit Pushed",
                color: 2829617,
                fields: [
                  {name: "Commit Message", value: $msg},
                  {name: "Added", value: ($added | if . == "" then "None" else . end)},
                  {name: "Modified", value: ($modified | if . == "" then "None" else . end)},
                  {name: "Removed", value: ($removed | if . == "" then "None" else . end)}
                ]
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$CLEAN_URL"
